<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ODIN Sign Up</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <!-- Left Image Section -->
    <div class="left-panel">
      <div class="logo-wrapper">
        <img src="assets/odin-lined.png" alt="Odin Logo" />
        <h1>ODIN</h1>
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="right-panel">
      <div class="top-text">
        <p><strong>This is not a real online service!</strong> You know you need something like this in your life to help you realize your deepest dreams.<br><br>
        Sign up <em>now</em> to get started.</p>
        <p><em>You <strong>know</strong> you want to.</em></p>
      </div>

      <form>
        <h2>Let's do this!</h2>

        <div class="form-row">
          <div>
            <label for="first-name">FIRST NAME</label>
            <input type="text" id="first-name" required />
          </div>
          <div>
            <label for="last-name">LAST NAME</label>
            <input type="text" id="last-name" required />
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="email">EMAIL</label>
            <input type="email" id="email" required />
          </div>
          <div>
            <label for="phone">PHONE NUMBER</label>
            <input type="tel" id="phone" required />
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="password">PASSWORD</label>
            <input type="password" id="password" required />
          </div>
          <div>
            <label for="confirm-password">CONFIRM PASSWORD</label>
            <input type="password" id="confirm-password" required />
          </div>
        </div>

        <button type="submit">Create Account</button>
        <p class="login">Already have an account? <a href="#">Log in</a></p>
      </form>
    </div>
  </div>
</body>
</html>
