<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Lists are used to represent real life list data-->
    <!--unordered list-->
    <ul>
        <li>apple</li>
        <ol>
            <li>red</li>
        </ol>
        <li>mango</li>
        <ol>
            <li>yellow</li>
        </ol>
    </ul><hr>
    <!--ordered list-->
    <ol>
        <li>strawberry</li>
        <ul>
            <li>red</li>
        </ul>
        <li>watermelon</li>
        <ul>
            <li>green</li>
        </ul>
    </ol><hr>
    <!--sublists can be made using the same way-->
    <!--Tables are used to represent real life table data.<table>-->
    <!--<tr> used to display table row-->
    <!--<td> used to display table data-->
    <!--<th> used to display table header-->
    <!--<caption> Student Data </caption>-->
    <!--thead & tbody in Tables 
    <thead> to wrap table head
    <tbody> to wrap table body-->
    <table>
        <caption> Student Data </caption>
        <thead>
            <tr>
                <th>serial no.</th>
                <th>subject</th>
                <th>credit </th>
                <th>grade </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>EP</td>
                <td>4 </td>
                <td>A+</td>
            </tr>
    
            <tr>
                <td>2</td>
                <td>CM</td>
                <td>3 </td>
                <td>A+</td>
            </tr>
        </tbody>
    
    </table><hr>
    
    <!--colspan to balance 1 columns to n columns-->
    <table>
        <caption> Student Data </caption>
        <thead>
            <tr>
                <th colspan="4">INFORMATION</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>EP</td>
                <td>4 </td>
                <td>A+</td>
            </tr>
    
            <tr>
                <td>2</td>
                <td>CM</td>
                <td>3 </td>
                <td>A+</td>
            </tr>
        </tbody>
    
    </table><hr>

</body>
</html>
