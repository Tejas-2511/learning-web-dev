<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS LEVEL 1</title>
    <style>
        h1 {
            color: red;
        }
    </style>
    
</head>
<body>
   <h1 style="color:green">hello from tejas</h1><!--inline styling-->
   <!--or to add property and value(ex color and green)we can use style tag,style tag is to be put inside head tag and not body-->
   <h1>color changing using style tag</h1>
   <!--h1 in {bracket} is selector-->
   <!--another option to make property changes to html is to use a external style sheet(CSS-cascading style sheet)-->
   <!--we will always try to write css as a separate file and not in html file-->
   <!-- we have to link html and css file using a special line in head tag <link rel="stylesheet" href="style.css">-->
</body>
</html>
