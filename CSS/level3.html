<body>
    <!--relative units % , em , rem-->
    <!--%=It is often used to define a size as relative to an element's parent object.-->
    <!--1em(relative to size of parent font size) so 2em would be twice of the normal font size-->
    <!--root em or rem uses font size of <html>,which would be similar to size of anything written in body tag-->
    <!--vh: relative to 1% viewport height vw : relative to 1% viewport width-->
    <!--The position CSS property sets how an element is positioned in a document.-->
    <!--position : static / relative /absolute/fixed-->

    <div id="box1">box1</div>
    <div id="box2">box2</div>
    <div id="box3">box3</div>
    <div id="box4">box4</div>
    <div id="box5">box5</div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, aliquam? Non quae iste, ab necessitatibus
        vitae corporis illo minima vel dolor saepe laudantium ratione enim beatae similique. Perspiciatis, dignissimos
        natus?</p>
    <!--static - default position (The top, right, bottom, left, and z-index properties have no effect)
        relative - element is relative to itself. (The top, right, bottom, left, and z-index will work)
        absolute - positioned relative to its closest positioned ancestor. (removed from the flow)
        fixed - positioned relative to browser. (removed from flow)
        sticky - positioned based on user's scroll position-->
    <!--It decides the stack level of elements
    z-index : auto (0)
    z-index : 1 / 2 / ...
    z-index : -1 / -2 / ...
    Overlapping elements with a larger z-index cover those with a smaller one.-->
