<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="level4.css">
</head>
<body>
    <!--flexbox 
    It is a one-dimensional layout method for arranging items in rows or columns.-->
    <!--we have to set display mode of a div to flex to make it a flexbox-->
    <h1>Flexbox Playground</h1>
    <div id="container">
        <div id="box1">box1</div>
        <div id="box2">box2</div>
        <div id="box3">box3</div>
        <div id="box4">box4</div>
        <div id="box5">box5</div>
    </div>
    <!--Flexbox Direction
    It sets how flex items are placed in the flex container, along which axis and direction.
    flex : row; (default)
    flex : row-reverse;
    flex : column;
    flex : column-reverse;-->

    <!--Flex Properties
    for Flex Container
    justify-content : alignment along the main axis.
    flex-start / flex-end / centre / space-evenly / space-between / space-around
    flex-wrap : nowrap / wrap / wrap-reverse
    align-items : alignment along the cross axis.
    align-content : alignment of space between & around the content along cross-axis-->

    <!--Flex Properties
    for Flex Item
    align-self : alignment of individual along the cross axis.
    flex-grow : how much a flex item will grow relative to the rest of the flex items if
    space is available
    flex-shrink : how much a flex item will shrink relative to the rest of the flex items if
    space is available-->
 
    <!--Media Queries
    Help create a responsive website -->

    
</body>
</html>
