<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="display.css">
</head>
<body>
    <!--display: inline / block / inline-block / none-->
    <!--inline - Takes only the space required by the element. (no margin/ padding)-->
    <!--block - Takes full space available in width.-->
    <!--inline-block - Similar to inline but we can set margin & padding.-->
    <!--none - To remove element from document flow.-->
    <div>this is a div</div>
    <button>button</button>
    <!--visibility: hidden;,space is reserved but in display none space is not reserved-->
    <!--alpha channel or opacity rgba(0,0,0,1),rgba(255,255,255,0.5)etc-->
</body>
</html>
